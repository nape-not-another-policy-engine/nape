[package]
name = "nape_cli"
version = "2.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "nape"
path = "src/main.rs"

[dependencies]
nape_domain = { path = "../../domain" }
attestify-oci = { package = "attestify-oci-oss", git = "ssh://git@github.com/attestify/attestify-oci-oss.git", tag = "0.1.0" }
kernel_oss = { path = "../../../../kernel/kernel-oss" }

clap = { version = "4.5.27", features = ["derive", "cargo"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
serde_yaml = "0.9.34"
toml = "0.8"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
jsonschema = { version = "0.18.3", default-features = false, features = ["draft202012"] }
sha2 = "0.10.8"
hex = "0.4.3"
libc = "0.2.189"

[dev-dependencies]
test_framework_oss = { path = "../../../../test-framework/test-framework-oss" }
