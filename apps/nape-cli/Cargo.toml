[package]
name = "nape_cli"
version = "1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "nape"
path = "src/main.rs"

[dependencies]
nape_domain = { path = "../../domain" }
kernel_oss = { git = "https://github.com/attestify/kernel-oss.git", tag="0.2.5" }

clap = { version = "4.5.27", features = ["derive", "cargo"] }
git2 = "0.20.3"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
serde_yaml = "0.9.34"
sha2 = "0.10.8"
hex = "0.4.3"

[dev-dependencies]
test_framework_oss = { git = "https://github.com/attestify/test-framework-oss.git", tag = "0.2.4", features = ["nape_filesystem"] }